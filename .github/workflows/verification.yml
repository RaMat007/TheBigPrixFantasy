name: Verificar Big Prix
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_calendar_2026 test_reconcile_results_2026 test_operations test_ui
      - run: python -m py_compile app.py crud.py db.py operations.py operations_ui.py dashboard_compact.py maintenance.py openf1_integration.py rules.py
