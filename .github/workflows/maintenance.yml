name: Mantenimiento Big Prix
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bigprix-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Verificar configuración
        id: config
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Configura DATABASE_URL y BACKUP_ENCRYPTION_KEY en los secrets de Actions."
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.13'
      - name: Instalar dependencias
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt
      - name: Respaldo, autopicks y resultados
        if: steps.config.outputs.ready == 'true'
        run: python maintenance.py
      - name: Guardar copia externa cifrada
        id: upload
        if: always() && steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bigprix-backup-${{ github.run_id }}
          path: backup_output/*.enc
          if-no-files-found: ignore
          retention-days: 60
      - name: Confirmar copia externa guardada
        if: always() && steps.config.outputs.ready == 'true' && steps.upload.outcome == 'success'
        run: python maintenance.py --mark-exported
